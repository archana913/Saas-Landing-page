<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Landing Page</title>
  <link href="../public/output.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">
  <section class="max-w-lg text-center p-6 bg-white rounded shadow-lg">
    <h1 class="text-4xl font-bold text-blue-600 mb-4">Boost Your Productivity</h1>
    <p class="text-gray-600 mb-6">Join our beta program and get early access to our SaaS product.</p>

    <form action="/signup" method="POST" class="flex flex-col gap-3">
      <input type="text" name="name" placeholder="Your name" required 
             class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      <input type="email" name="email" placeholder="Your email" required 
             class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      <button type="submit" 
              class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Sign Up</button>
    </form>
  </section>
</body>
</html>
